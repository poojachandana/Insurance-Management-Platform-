spring.application.name=insurance-management-platform

# =========================================================
# DEFAULT: H2 in-memory database (zero setup, runs instantly)
# H2 console available at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:insurancedb | user: sa | password: (empty)
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/insurancedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
# PRODUCTION: PostgreSQL (uncomment below and comment H2 above
# to use PostgreSQL instead. Update credentials as needed.)
# =========================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/insurance_db
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=8080

# JWT configuration
app.jwt.secret=ThisIsASecretKeyForInsuranceManagementPlatformJWTSigningChangeItInProduction123456
app.jwt.expiration-ms=86400000

# File upload / storage
app.file.upload-dir=uploads
app.file.report-dir=reports
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - frontend origin
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Swagger UI at http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.insurance.platform=INFO
