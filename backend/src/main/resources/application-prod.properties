# =========================================================
# PRODUCTION PROFILE — activated by setting SPRING_PROFILES_ACTIVE=prod
# (e.g. as a Render environment variable). Overrides the H2 defaults in
# application.properties with PostgreSQL, configured entirely via
# environment variables so no secrets live in this file.
#
# Required environment variables on Render:
#   SPRING_PROFILES_ACTIVE        = prod
#   SPRING_DATASOURCE_URL         = jdbc:postgresql://<neon-host>/<db>?sslmode=require
#   SPRING_DATASOURCE_USERNAME    = <from Neon>
#   SPRING_DATASOURCE_PASSWORD    = <from Neon>
#   CORS_ALLOWED_ORIGINS          = https://<your-vercel-app>.vercel.app
#   APP_JWT_SECRET                = <a long random string — do not reuse the local default>
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable the H2 console in production (it's meaningless without H2, and shouldn't be exposed anyway)
spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET}